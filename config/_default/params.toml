# -- Theme Options --
# Only values that deliberately DIFFER from the Blowfish module defaults are
# set here; anything omitted falls back to the theme's config/_default/params.toml.
# https://blowfish.page/docs/configuration/#theme-parameters

# Marketing keywords rendered into the <meta name="keywords"> tag by the theme.
# EN + JP terms; languages.ja.toml may override with language-specific keywords.
keywords = [
  "Haruna Hatakeyama",
  "digital marketing specialist",
  "e-commerce operations",
  "fashion retail",
  "visual merchandising",
  "brand identity",
  "paid social advertising",
  "Meta Ads Manager",
  "Google Analytics 4",
  "email marketing",
  "Vancouver",
  "デジタルマーケティング",
  "EC運用",
  "ビジュアルマーチャンダイジング",
  "ブランディング",
  "ポートフォリオ",
]

enableStructuredBreadcrumbs = true # BreadcrumbList JSON-LD (schema.html); keyless/free.

# Content lives under content/projects; feeds recent-articles and RSS.
mainSections = ["projects"]

[languageRedirect]
enabled = true                 # client-side redirect to browser-preferred language (EN fallback)
browserRedirectHomeOnly = true
storedLanguageRedirect = true

[footer]
showThemeAttribution = false # owner decision: no "powered by" line

[homepage]
layout = "page"
showRecent = true
showRecentItems = 12
showMoreLinkDest = "/projects/" # showMoreLink intentionally off
cardView = true

[article]
showDate = false # portfolio pieces, not blog posts
showAuthor = false
showBreadcrumbs = true
showRelatedContent = true # related pages under the article
relatedContentLimit = 3
showTaxonomies = true # render tag pills in the article meta area
showCategories = false
showWordCount = false # designer decision: word counts are noise on a visual portfolio
showReadingTime = false # designer decision: ditto
sharingLinks = [
  "linkedin",
  "twitter",
  "email",
] # pure outbound links, no JS/keys

[list]
showCards = true
featureImageHover = true
orderByWeight = true
groupByYear = false
cardView = true

[sitemap]
excludedKinds = ["taxonomy", "term"]

[taxonomy]
cardView = true # card list on /tags/ index

[term]
cardView = true # card list on /tags/<tag>/ pages
