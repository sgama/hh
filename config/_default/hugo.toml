# -- Site Configuration --
# Refer to the theme docs for more details about each of these parameters.
# https://blowfish.page/docs/getting-started/

baseURL = "http://localhost:1313/" # set to your production URL when deploying

[module]
[[module.imports]]
path = "github.com/nunocoracao/blowfish/v3"

defaultContentLanguage = "en"
# English lives at site root ("/"), Japanese at "/ja/". Browser language of Japanese gets
# client-side redirected to /ja/ per [languageRedirect] in params.toml (falls back to EN).
defaultContentLanguageInSubdir = false

enableRobotsTXT = true
summaryLength = 0

buildDrafts = false
buildFuture = false

enableEmoji = true

# googleAnalytics = "G-XXXXXXXXX"

[pagination]
pagerSize = 100

[imaging]
anchor = 'Center'

[taxonomies]
tag = "tags"
category = "categories"
series = "series"

[sitemap]
changefreq = 'daily'
filename = 'sitemap.xml'
priority = 0.5

[outputs]
home = ["HTML", "RSS", "JSON"]

[related]
threshold = 0
toLower = false

[[related.indices]]
name = "tags"
weight = 100

[[related.indices]]
name = "categories"
weight = 100

[[related.indices]]
name = "series"
weight = 50

[[related.indices]]
name = "date"
weight = 10
