# -- Site Configuration --
# Only values that deliberately differ from (or add to) what the Blowfish
# module's config/_default/hugo.toml provides. Globals must be declared BEFORE
# [module] — after [[module.imports]] TOML would nest them inside the import.
# https://blowfish.page/docs/getting-started/

baseURL = "https://sgama.github.io/hh/"

enableRobotsTXT = true # robots.txt via the theme's layouts/robots.txt
# English lives at site root ("/"), Japanese at "/ja/" (defaults elsewhere).
defaultContentLanguage = "en"
mainSections = ["projects"]

# [outputs] matches the module default but must be stated: dropping it loses
# the JSON home output the Fuse search index depends on. Never list "robots"
# in home outputs — per-language config can't override it (both language homes
# would write to the same root path, hence a duplicate-path warning).
[outputs]
home = ["HTML", "RSS", "JSON"]

# Empirically the module's [related] block does not surface in the merged
# config; without a threshold of 0 the Hugo default (80) matches nothing.
[related]
threshold = 0
toLower = false

[[related.indices]]
name = "tags"
weight = 100

[[related.indices]]
name = "keywords"
weight = 80

[[related.indices]]
includeNewer = false
lowerDate = "1970-01-01"
name = "date"
toHigherDate = false
upperDate = "2099-01-01"
weight = 10

[pagination]
pagerSize = 100

[imaging]
anchor = 'Center'

[module]
[[module.imports]]
path = "github.com/nunocoracao/blowfish/v3"
